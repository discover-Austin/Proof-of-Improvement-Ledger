[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-of-improvement-ledger"
version = "0.1.0"
description = "Consensus-gated continual learning ledger for safe in-house model adaptation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Austin Grandstaff" }
]
keywords = [
  "continual-learning",
  "model-validation",
  "learning-ledger",
  "adaptive-ai",
  "external-memory",
  "consensus-learning"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.scripts]
poi-ledger = "proof_of_improvement_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
